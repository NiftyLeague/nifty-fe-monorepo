packages:
  - 'apps/*'
  - 'packages/*'

nodeVersion: 24.18.0
engineStrict: true
optimisticRepeatInstall: false
verifyDepsBeforeRun: error

publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'

overrides:
  'bnc-sdk>crypto-es': ^2.1.0
  'bn.js@>=4 <4.12.3': 4.12.3
  'brace-expansion@>=2 <2.0.3': 2.0.3
  'fast-uri@>=3 <3.1.2': 3.1.2
  'immutable@>=4 <4.3.8': 4.3.8
  'postcss@<8.5.10': 8.5.19
  'protobufjs@>=7 <7.6.3': 7.6.3
  'shell-quote@<=1.8.3': 1.8.4
  'tmp@>=0.2 <0.2.6': 0.2.6
  'undici@>=6 <6.27.0': 6.27.0
  'websocket-driver@<0.7.5': 0.7.5
  'webpack@>=5 <5.104.1': 5.104.1
  'ws@>=7 <7.5.11': 7.5.11
  'ws@>=8 <8.21.0': 8.21.0
  zod: ^4.4.3

# protobufjs 6.x is pinned by legacy Axelar/Cow/IPFS SDKs. The critical fix is
# only published in 7.x, which is a breaking upgrade for those transitive
# consumers; dependency review still blocks newly introduced high-risk changes.
auditConfig:
  ignoreGhsas:
    - GHSA-xq3m-2v4x-88gg

peerDependencyRules:
  allowedVersions:
    '@types/react-dom': 19.2.3
    '@types/react': 19.2.17
    cross-fetch: '4'
    crypto-es: ^2.1.0
    lit: 3.3.1
    next: 16.2.10
    react-dom: ^19.2.7
    react: ^19.2.7
    three: 0.181.2

allowBuilds:
  '@axelar-network/axelarjs-sdk': true
  '@opensea/seaport-js': true
  '@prisma/engines': true
  '@reown/appkit': true
  '@sentry/cli': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  bufferutil: true
  core-js: true
  core-js-pure: true
  esbuild: true
  keccak: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
