name: Re-align Staging

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes, catch drift pushed to main outside the promotion flow
    # (security advisories, code-foundry sync commits, dependabot, etc).
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Only one reconciliation may inspect/push/create a PR at a time. Without this,
# two scheduled or push-triggered runs can both pass the duplicate check before
# either one creates its PR.
concurrency:
  group: re-align-staging
  cancel-in-progress: false

jobs:
  re-align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Drift detection only needs commit/tree objects and the workflow
          # itself. Avoid materializing this repository's ~900 MB history and
          # blob set on every scheduled no-drift check; the merge preview still
          # materializes the full staging tree only when drift is real.
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: |
            .github

      - name: Detect staging tree drift
        id: drift
        run: |
          set -euo pipefail
          git fetch origin main staging --no-tags

          PROMOTION_PR=$(gh pr list \
            --base main \
            --head staging \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$PROMOTION_PR" ]; then
            echo "Promotion PR #$PROMOTION_PR already targets main;"
            echo "deferring staging re-alignment until promotion completes."
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAIN_TREE=$(git rev-parse 'origin/main^{tree}')
          STAGING_TREE=$(git rev-parse 'origin/staging^{tree}')
          if [ "$MAIN_TREE" = "$STAGING_TREE" ]; then
            echo "Main and staging have identical Git trees (no drift)."
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            # A divergent tree is not necessarily drift: staging may contain
            # legitimate forward work. Preview the exact merge policy used by
            # the PR and compare its resulting tree with staging instead.
            # When both branches changed a path after their merge base,
            # staging is authoritative so reconciliation cannot regress a
            # validated forward change through a clean, non-conflicting merge.
            # Use an isolated worktree so the preview applies the exact same
            # conflict policy as PR creation, including modify/delete paths.
            preview_dir=$(mktemp -d)
            cleanup_preview() {
              git worktree remove --force "$preview_dir" >/dev/null 2>&1 || true
              rmdir "$preview_dir" >/dev/null 2>&1 || true
            }
            trap cleanup_preview EXIT
            git worktree add --detach "$preview_dir" origin/staging >/dev/null
            # The caller checkout is sparse to keep no-drift runs cheap. A
            # linked worktree inherits that sparse index, so materialize the
            # full staging tree before the merge preview restores staging-only
            # paths.
            git -C "$preview_dir" sparse-checkout disable
            staging_head=$(git -C "$preview_dir" rev-parse HEAD)
            git -C "$preview_dir" config user.name "re-align-preview"
            git -C "$preview_dir" config user.email "re-align-preview@users.noreply.github.com"

            is_release_metadata_path() {
              case "$1" in
                .release-please-manifest.json|package.json|*/package.json|CHANGELOG.md|*/CHANGELOG.md)
                  return 0
                  ;;
                *)
                  return 1
                  ;;
              esac
            }

            resolve_ours_conflicts() {
              local conflicted_path
              local conflicts_file
              conflicts_file=$(mktemp)
              git -C "$preview_dir" diff --name-only --diff-filter=U -z > "$conflicts_file"
              while IFS= read -r -d '' conflicted_path; do
                if is_release_metadata_path "$conflicted_path"; then
                  if git -C "$preview_dir" cat-file -e "origin/main:$conflicted_path" 2>/dev/null; then
                    git -C "$preview_dir" checkout origin/main -- "$conflicted_path"
                    git -C "$preview_dir" add -- "$conflicted_path"
                  else
                    git -C "$preview_dir" rm -- "$conflicted_path"
                  fi
                elif git -C "$preview_dir" cat-file -e "HEAD:$conflicted_path" 2>/dev/null; then
                  git -C "$preview_dir" checkout --ours -- "$conflicted_path"
                  git -C "$preview_dir" add -- "$conflicted_path"
                else
                  git -C "$preview_dir" rm -- "$conflicted_path"
                fi
              done < "$conflicts_file"
              rm -f "$conflicts_file"
            }

            if ! git -C "$preview_dir" merge --no-commit --no-ff -X ours \
              origin/main -m "chore: merge main into staging to re-align branches"; then
              CONFLICTS=$(git -C "$preview_dir" diff --name-only --diff-filter=U)
              if [ -z "$CONFLICTS" ]; then
                echo "The re-alignment merge preview failed without"
                echo "merge conflicts; failing closed for review."
                exit 1
              fi
              resolve_ours_conflicts
              if [ -n "$(git -C "$preview_dir" diff --name-only --diff-filter=U)" ]; then
                echo "Unable to resolve every re-alignment conflict safely;"
                echo "failing closed for review."
                exit 1
              fi
            fi

            # The recursive merge strategy only applies -X ours to conflicts.
            # Restore every path changed by staging since the merge base so a
            # clean main-side edit cannot overwrite staging's forward work.
            merge_base=$(git -C "$preview_dir" merge-base "$staging_head" origin/main)
            changed_paths_file=$(mktemp)
            git -C "$preview_dir" diff --no-renames --name-only -z \
              "$merge_base" "$staging_head" > "$changed_paths_file"
            while IFS= read -r -d '' changed_path; do
              if is_release_metadata_path "$changed_path"; then
                if git -C "$preview_dir" cat-file -e "origin/main:$changed_path" 2>/dev/null; then
                  git -C "$preview_dir" restore --source=origin/main --staged --worktree -- "$changed_path"
                else
                  git -C "$preview_dir" rm --ignore-unmatch -- "$changed_path"
                fi
              elif git -C "$preview_dir" cat-file -e "$staging_head:$changed_path" 2>/dev/null; then
                git -C "$preview_dir" restore --source="$staging_head" --staged --worktree -- "$changed_path"
              else
                git -C "$preview_dir" rm --ignore-unmatch -- "$changed_path"
              fi
            done < "$changed_paths_file"
            rm -f "$changed_paths_file"

            if [ -n "$(git -C "$preview_dir" diff --name-only --diff-filter=U)" ]; then
              echo "Unable to preserve the staging-first merge policy safely;"
              exit 1
            fi

            MERGED_TREE=$(git -C "$preview_dir" write-tree)
            if [ "$MERGED_TREE" = "$STAGING_TREE" ]; then
              echo "Main is already represented in staging under the"
              echo "re-alignment merge policy."
              echo "drifted=false" >> "$GITHUB_OUTPUT"
            else
              echo "Merging main would change staging's Git tree."
              echo "drifted=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Close stale re-align PRs when aligned
        if: steps.drift.outputs.drifted == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STALE_PRS=$(gh pr list \
            --base staging \
            --state open \
            --limit 1000 \
            --json number,title,headRefName \
            --jq '
              map(select(
                .title == "chore: re-align staging with main" or
                (.headRefName | startswith("chore/re-align-staging-"))
              ))
              | .[].number
            ')

          while read -r pr; do
            [ -n "$pr" ] || continue
            echo "Closing stale no-op re-alignment PR #$pr."
            gh pr close "$pr" \
              --comment "Closing stale no-op re-alignment PR: main and staging are already tree-aligned." \
              --delete-branch
          done <<< "$STALE_PRS"

      - name: Create re-align PR if drifted
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="chore: re-align staging with main"
          BODY="Automatically opened because main and staging have"
          BODY+=" different Git trees. Merging main into staging keeps the"
          BODY+=" branches in sync so the promotion PR stays conflict-free."

          find_existing_pr() {
            gh pr list \
              --base staging \
              --state open \
              --limit 1000 \
              --json number,title,headRefName \
              --jq '
                map(select(
                  .title == "chore: re-align staging with main" or
                  (.headRefName | startswith("chore/re-align-staging-"))
                ))
                | first
                | .number // empty
              '
          }

          find_promotion_pr() {
            gh pr list \
              --base main \
              --head staging \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          }

          EXISTING=$(find_existing_pr)
          if [ -n "$EXISTING" ]; then
            echo "Open re-align PR #$EXISTING already targets staging;"
            echo "skipping duplicate creation."
            exit 0
          fi

          PROMOTION=$(find_promotion_pr)
          if [ -n "$PROMOTION" ]; then
            echo "Promotion PR #$PROMOTION already targets main;"
            echo "skipping re-alignment creation until promotion completes."
            exit 0
          fi

          # The drift preview ran against an earlier pair of refs. Refresh
          # them before creating a branch so a promotion or manual repair
          # that completed during the preview cannot produce an empty PR.
          git fetch origin main staging --no-tags
          CURRENT_MAIN_TREE=$(git rev-parse 'origin/main^{tree}')
          CURRENT_STAGING_TREE=$(git rev-parse 'origin/staging^{tree}')
          if [ "$CURRENT_MAIN_TREE" = "$CURRENT_STAGING_TREE" ]; then
            echo "Main and staging are aligned after the drift preview;"
            echo "skipping stale re-alignment creation."
            exit 0
          fi

          BRANCH="chore/re-align-staging-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          BOT_EMAIL="41898282+github-actions[bot]"
          BOT_EMAIL+="@users.noreply.github.com"
          git config user.email "$BOT_EMAIL"
          # The initial checkout is sparse because drift detection only needs
          # the workflow. Drifted runs now need the full staging tree before
          # the merge restore can materialize changed application/test paths.
          git sparse-checkout disable
          git checkout -b "$BRANCH" origin/staging
          staging_head=$(git rev-parse HEAD)

          is_release_metadata_path() {
            case "$1" in
              .release-please-manifest.json|package.json|*/package.json|CHANGELOG.md|*/CHANGELOG.md)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          resolve_ours_conflicts() {
            local conflicted_path
            local conflicts_file
            conflicts_file=$(mktemp)
            git diff --name-only --diff-filter=U -z > "$conflicts_file"
            while IFS= read -r -d '' conflicted_path; do
              if is_release_metadata_path "$conflicted_path"; then
                if git cat-file -e "origin/main:$conflicted_path" 2>/dev/null; then
                  git checkout origin/main -- "$conflicted_path"
                  git add -- "$conflicted_path"
                else
                  git rm -- "$conflicted_path"
                fi
              elif git cat-file -e "HEAD:$conflicted_path" 2>/dev/null; then
                git checkout --ours -- "$conflicted_path"
                git add -- "$conflicted_path"
              else
                # For modify/delete conflicts, staging's deletion is the
                # authoritative result and must be recorded explicitly.
                git rm -- "$conflicted_path"
              fi
            done < "$conflicts_file"
            rm -f "$conflicts_file"
          }

          # Merge main into staging. Conflicts keep staging's version (-X ours)
          # for application and source files, while main's release-managed
          # metadata remains authoritative. Git's recursive strategy leaves
          # modify/delete conflicts unresolved, so resolve those paths
          # explicitly with the same policy.
          if ! git merge origin/main --no-edit --no-ff -X ours \
            -m "chore: merge main into staging to re-align branches"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ -z "$CONFLICTS" ]; then
              echo "The re-alignment merge failed without merge conflicts;"
              echo "aborting without opening a PR."
              git merge --abort
              exit 1
            fi
            resolve_ours_conflicts
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unable to resolve every re-alignment conflict safely;"
              git merge --abort
              exit 1
            fi
            git commit --no-edit
          fi

          # Keep staging authoritative for changed application/source paths,
          # but take release-managed metadata from main so version files and
          # changelogs cannot regress during a post-release re-alignment.
          merge_base=$(git merge-base "$staging_head" origin/main)
          changed_paths_file=$(mktemp)
          git diff --no-renames --name-only -z \
            "$merge_base" "$staging_head" > "$changed_paths_file"
          while IFS= read -r -d '' changed_path; do
            if is_release_metadata_path "$changed_path"; then
              if git cat-file -e "origin/main:$changed_path" 2>/dev/null; then
                git restore --source=origin/main --staged --worktree -- "$changed_path"
              else
                git rm --ignore-unmatch -- "$changed_path"
              fi
            elif git cat-file -e "$staging_head:$changed_path" 2>/dev/null; then
              git restore --source="$staging_head" --staged --worktree -- "$changed_path"
            else
              git rm --ignore-unmatch -- "$changed_path"
            fi
          done < "$changed_paths_file"
          rm -f "$changed_paths_file"

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unable to preserve the staging-first merge policy safely;"
            git merge --abort 2>/dev/null || true
            exit 1
          fi

          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push -u origin "$BRANCH"

          # Do not publish a PR from a stale base. A concurrent promotion or
          # feature merge must be observed by the next scheduled/push run so
          # the generated branch always describes the current staging ref.
          git fetch origin staging --no-tags
          current_main_tree=$(git rev-parse 'origin/main^{tree}')
          current_staging_head=$(git rev-parse origin/staging)
          current_staging_tree=$(git rev-parse 'origin/staging^{tree}')
          branch_tree=$(git rev-parse "$BRANCH^{tree}")
          if [ "$current_main_tree" = "$current_staging_tree" ] || \
            [ "$current_staging_head" != "$staging_head" ] || \
            [ "$current_staging_tree" = "$branch_tree" ]; then
            echo "Staging changed or is already aligned after the push;"
            echo "deleting the stale re-alignment branch without opening a PR."
            git push origin --delete "$BRANCH" >/dev/null || true
            exit 0
          fi

          # Check again after pushing to close the race with an already-open PR.
          EXISTING=$(find_existing_pr)
          if [ -n "$EXISTING" ]; then
            echo "Open re-align PR #$EXISTING already targets staging;"
            echo "skipping duplicate creation."
            git push origin --delete "$BRANCH"
            exit 0
          fi

          # Perform one last parity check immediately before PR creation. A
          # release can finish between the branch push and the duplicate
          # check; never publish a no-op PR for that race.
          git fetch origin main staging --no-tags
          current_main_tree=$(git rev-parse 'origin/main^{tree}')
          current_staging_tree=$(git rev-parse 'origin/staging^{tree}')
          if [ "$current_main_tree" = "$current_staging_tree" ]; then
            echo "Main and staging aligned before PR creation;"
            echo "deleting the stale re-alignment branch without opening a PR."
            git push origin --delete "$BRANCH" >/dev/null || true
            exit 0
          fi

          PROMOTION=$(find_promotion_pr)
          if [ -n "$PROMOTION" ]; then
            echo "Promotion PR #$PROMOTION opened during re-alignment;"
            echo "deleting the stale re-alignment branch without opening a PR."
            git push origin --delete "$BRANCH" >/dev/null || true
            exit 0
          fi

          gh pr create \
            --base staging \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY"
