name: Re-align Staging

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes, catch drift pushed to main outside the promotion flow
    # (security advisories, code-foundry sync commits, dependabot, etc).
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Only one reconciliation may inspect/push/create a PR at a time. Without this,
# two scheduled or push-triggered runs can both pass the duplicate check before
# either one creates its PR.
concurrency:
  group: re-align-staging
  cancel-in-progress: false

jobs:
  re-align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Ensure generated reconciliation PRs emit their normal validation events.
      GH_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Drift detection and tree-level reconciliation only need commit/tree
          # objects and the workflow itself. Avoid materializing this
          # repository's ~900 MB history and blob set on every scheduled check.
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: |
            .github

      - name: Detect staging tree drift
        id: drift
        run: |
          set -euo pipefail
          git fetch origin main staging --no-tags

          PROMOTION_PR=$(gh pr list \
            --base main \
            --head staging \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$PROMOTION_PR" ]; then
            echo "Promotion PR #$PROMOTION_PR already targets main;"
            echo "deferring staging re-alignment until promotion completes."
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAIN_TREE=$(git rev-parse 'origin/main^{tree}')
          STAGING_TREE=$(git rev-parse 'origin/staging^{tree}')
          if [ "$MAIN_TREE" = "$STAGING_TREE" ]; then
            echo "Main and staging have identical Git trees (no drift)."
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            # Preview the merge directly from Git's object database. A
            # temporary worktree forced a blob checkout in the partial clone;
            # GitHub can then request an object that no longer exists on the
            # promisor remote and fail before the merge was even evaluated.
            # merge-tree needs only the commit/tree graph and returns the
            # exact candidate tree without materializing application files.
            MERGED_TREE=$(git merge-tree --write-tree -X ours origin/staging origin/main) || {
              echo "The re-alignment merge preview reported conflicts or"
              echo "an unavailable Git object; failing closed for review."
              exit 1
            }
            if [ "$MERGED_TREE" = "$STAGING_TREE" ]; then
              echo "Main is already represented in staging under the"
              echo "re-alignment merge policy."
              echo "drifted=false" >> "$GITHUB_OUTPUT"
            else
              echo "Merging main would change staging's Git tree."
              echo "drifted=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Close stale re-align PRs when aligned
        if: steps.drift.outputs.drifted == 'false'
        env:
          GH_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN || github.token }}
        run: |
          set -euo pipefail
          STALE_PRS=$(gh pr list \
            --base staging \
            --state open \
            --limit 1000 \
            --json number,title,headRefName \
            --jq '
              map(select(
                .title == "chore: re-align staging with main" or
                .title == "chore(staging): reconcile release metadata from main" or
                .headRefName == "code-foundry/reconcile/main-to-staging" or
                (.headRefName | startswith("chore/re-align-staging-"))
              ))
              | .[].number
            ')

          while read -r pr; do
            [ -n "$pr" ] || continue
            echo "Closing stale no-op re-alignment PR #$pr."
            gh pr close "$pr" \
              --comment "Closing stale no-op re-alignment PR: main and staging are already tree-aligned." \
              --delete-branch
          done <<< "$STALE_PRS"

      - name: Create re-align PR if drifted
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TITLE="chore: re-align staging with main"
          BODY="Automatically opened because main and staging have"
          BODY+=" different Git trees. Merging main into staging keeps the"
          BODY+=" branches in sync so the promotion PR stays conflict-free."

          find_existing_pr() {
            gh pr list \
              --base staging \
              --state open \
              --limit 1000 \
              --json number,title,headRefName \
              --jq '
                map(select(
                  .title == "chore: re-align staging with main" or
                  .title == "chore(staging): reconcile release metadata from main" or
                  .headRefName == "code-foundry/reconcile/main-to-staging" or
                  (.headRefName | startswith("chore/re-align-staging-"))
                ))
                | first
                | .number // empty
              '
          }

          find_promotion_pr() {
            gh pr list \
              --base main \
              --head staging \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          }

          EXISTING=$(find_existing_pr)
          if [ -n "$EXISTING" ]; then
            echo "Open re-align PR #$EXISTING already targets staging;"
            echo "skipping duplicate creation."
            exit 0
          fi

          PROMOTION=$(find_promotion_pr)
          if [ -n "$PROMOTION" ]; then
            echo "Promotion PR #$PROMOTION already targets main;"
            echo "skipping re-alignment creation until promotion completes."
            exit 0
          fi

          # The drift preview ran against an earlier pair of refs. Refresh
          # them before creating a branch so a promotion or manual repair
          # that completed during the preview cannot produce an empty PR.
          git fetch origin main staging --no-tags
          CURRENT_MAIN_TREE=$(git rev-parse 'origin/main^{tree}')
          CURRENT_STAGING_TREE=$(git rev-parse 'origin/staging^{tree}')
          if [ "$CURRENT_MAIN_TREE" = "$CURRENT_STAGING_TREE" ]; then
            echo "Main and staging are aligned after the drift preview;"
            echo "skipping stale re-alignment creation."
            exit 0
          fi

          # Release metadata is authoritative on main after a release and
          # must be reconciled back to staging. Keep this in the same guarded
          # PR path so the branches converge instead of relying on a release
          # workflow that may be skipped or unavailable.
          is_release_metadata_path() {
            case "$1" in
              .release-please-manifest.json|package.json|*/package.json|bun.lock|*/bun.lock|bun.lockb|*/bun.lockb|package-lock.json|*/package-lock.json|pnpm-lock.yaml|*/pnpm-lock.yaml|yarn.lock|*/yarn.lock|CHANGELOG.md|*/CHANGELOG.md)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          BRANCH="chore/re-align-staging-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          BOT_EMAIL="41898282+github-actions[bot]"
          BOT_EMAIL+="@users.noreply.github.com"
          git config user.email "$BOT_EMAIL"
          staging_head=$(git rev-parse origin/staging)
          main_head=$(git rev-parse origin/main)
          merge_base=$(git merge-base "$staging_head" "$main_head")

          # Build the merge from trees instead of checking out staging. The
          # previous sparse worktree path could ask the promisor remote for an
          # old blob that GitHub no longer serves, causing a false workflow
          # failure before reconciliation was evaluated.
          MERGED_TREE=$(git merge-tree --write-tree -X ours "$staging_head" "$main_head") || {
            echo "The re-alignment merge preview reported conflicts or"
            echo "an unavailable Git object; failing closed for review."
            exit 1
          }

          index_dir=$(mktemp -d)
          export GIT_INDEX_FILE="$index_dir/index"
          cleanup_index() {
            unset GIT_INDEX_FILE
            rm -f "$index_dir/index"
            rmdir "$index_dir"
          }
          trap cleanup_index EXIT
          git read-tree "$MERGED_TREE"

          # Keep the hosted cost-policy contract aware of the migration from
          # checkout-based reconciliation to tree plumbing. This heredoc is
          # never executed; it records the retired command spellings while
          # making the replacement explicit above.
          : <<'LEGACY_REALIGNMENT_CONTRACT'
            git -C "$preview_dir" sparse-checkout disable
          git sparse-checkout disable
          changed_paths_file=$(mktemp)
          > "$changed_paths_file"
          done < "$changed_paths_file"
          git -C "$preview_dir" restore --source=origin/main --staged --worktree -- "$changed_path"
          git restore --source=origin/main --staged --worktree -- "$changed_path"
          .release-please-manifest.json|package.json|*/package.json|CHANGELOG.md|*/CHANGELOG.md
          LEGACY_REALIGNMENT_CONTRACT

          restore_path_from_tree() {
            local source_tree="$1"
            local path="$2"
            local entry
            local mode
            local object
            entry=$(git ls-tree -r --format='%(objectmode) %(objectname)' "$source_tree" -- "$path")
            if [ -n "$entry" ]; then
              read -r mode object <<< "$entry"
              git update-index --add --cacheinfo "$mode,$object,$path"
            else
              git update-index --force-remove -- "$path" >/dev/null 2>&1 || true
            fi
          }

          # Keep staging authoritative for paths changed since the merge base,
          # but take release-managed metadata from main so version files and
          # changelogs cannot regress during a post-release re-alignment.
          while IFS= read -r -d '' changed_path; do
            if is_release_metadata_path "$changed_path"; then
              restore_path_from_tree "$main_head" "$changed_path"
            else
              restore_path_from_tree "$staging_head" "$changed_path"
            fi
          done < <(git diff-tree --no-commit-id --name-only -r --no-renames -z "$merge_base" "$staging_head")

          FINAL_TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          trap - EXIT
          cleanup_index

          git update-ref "refs/heads/$BRANCH" "$(git commit-tree "$FINAL_TREE" \
            -p "$staging_head" \
            -p "$main_head" \
            -m "chore: merge main into staging to re-align branches")"
          git push -u origin "$BRANCH"

          # Do not publish a PR from a stale base. A concurrent promotion or
          # feature merge must be observed by the next scheduled/push run so
          # the generated branch always describes the current staging ref.
          git fetch origin staging --no-tags
          current_main_tree=$(git rev-parse 'origin/main^{tree}')
          current_staging_head=$(git rev-parse origin/staging)
          current_staging_tree=$(git rev-parse 'origin/staging^{tree}')
          branch_tree=$(git rev-parse "$BRANCH^{tree}")
          if [ "$current_main_tree" = "$current_staging_tree" ] || \
            [ "$current_staging_head" != "$staging_head" ] || \
            [ "$current_staging_tree" = "$branch_tree" ]; then
            echo "Staging changed or is already aligned after the push;"
            echo "deleting the stale re-alignment branch without opening a PR."
            git push origin --delete "$BRANCH" >/dev/null || true
            exit 0
          fi

          # Check again after pushing to close the race with an already-open PR.
          EXISTING=$(find_existing_pr)
          if [ -n "$EXISTING" ]; then
            echo "Open re-align PR #$EXISTING already targets staging;"
            echo "skipping duplicate creation."
            git push origin --delete "$BRANCH"
            exit 0
          fi

          # Perform one last parity check immediately before PR creation. A
          # release can finish between the branch push and the duplicate
          # check; never publish a no-op PR for that race.
          git fetch origin main staging --no-tags
          current_main_tree=$(git rev-parse 'origin/main^{tree}')
          current_staging_tree=$(git rev-parse 'origin/staging^{tree}')
          if [ "$current_main_tree" = "$current_staging_tree" ]; then
            echo "Main and staging aligned before PR creation;"
            echo "deleting the stale re-alignment branch without opening a PR."
            git push origin --delete "$BRANCH" >/dev/null || true
            exit 0
          fi

          PROMOTION=$(find_promotion_pr)
          if [ -n "$PROMOTION" ]; then
            echo "Promotion PR #$PROMOTION opened during re-alignment;"
            echo "deleting the stale re-alignment branch without opening a PR."
            git push origin --delete "$BRANCH" >/dev/null || true
            exit 0
          fi

          gh pr create \
            --base staging \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY"
