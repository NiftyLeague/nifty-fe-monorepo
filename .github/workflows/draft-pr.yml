name: Code Foundry

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'docs/*'
      - 'style/*'
      - 'test/*'
      - 'codex/*'
      # Promotion branches already have an explicit PR targeting main.
      - '!codex/promote-*'
      # Re-alignment creates and owns its own PR after its merge preview.
      - '!chore/re-align-staging-*'

permissions:
  contents: read
  pull-requests: write

jobs:
  draft-pr:
    name: Draft PR
    uses: 0xPlayerOne/code-foundry/.github/workflows/draft-pr.yml@v0.37.4
    with:
      runner: ubuntu-slim
      base: staging
    secrets:
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
