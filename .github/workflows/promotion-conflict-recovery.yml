name: Promotion Conflict Recovery

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: promotion-conflict-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name == 'push' ||
      (
        github.event.pull_request.head.ref == 'staging' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      # Prefer the automation token. The repository token is a safe fallback;
      # validation is dispatched explicitly after fallback-authenticated PR creation.
      GH_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN || github.token }}
      PROMOTION_PR: ${{ github.event.pull_request.number || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Detect non-ancestor staging promotion
        id: detect
        run: |
          set -euo pipefail
          git fetch origin main staging --no-tags

          if git merge-base --is-ancestor origin/main origin/staging; then
            echo "staging is based on main; the normal promotion PR can proceed."
            echo "needs_recovery=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "staging and main have independent histories; using a main-based snapshot."
          echo "needs_recovery=true" >> "$GITHUB_OUTPUT"

      - name: Create or refresh rebase-compatible promotion snapshot
        if: steps.detect.outputs.needs_recovery == 'true'
        run: |
          set -euo pipefail

          close_staging_promotions() {
            staging_promotions=$(gh pr list \
              --base main \
              --head staging \
              --state open \
              --limit 1000 \
              --json number \
              --jq '.[].number')
            while read -r promotion_pr; do
              [ -n "$promotion_pr" ] || continue
              echo "Closing superseded staging promotion PR #$promotion_pr."
              gh pr close "$promotion_pr" \
                --comment "Replaced by the rebase-compatible promotion snapshot; no validated staging changes were discarded."
            done <<< "$staging_promotions"
          }

          snapshot_info=$(gh pr list \
            --base main \
            --state open \
            --limit 1000 \
            --json number,headRefName \
            --jq 'map(select(.headRefName | startswith("codex/promote-staging-snapshot-"))) | first | if . then "\(.number)\t\(.headRefName)" else empty end')
          existing_snapshot=""
          branch=""
          if [ -n "$snapshot_info" ]; then
            IFS=$'\t' read -r existing_snapshot branch <<< "$snapshot_info"
            echo "Found existing promotion snapshot PR #$existing_snapshot on $branch."
          fi

          main_tree=$(git rev-parse 'origin/main^{tree}')
          staging_tree=$(git rev-parse 'origin/staging^{tree}')
          if [ "$main_tree" = "$staging_tree" ]; then
            echo "main already contains the exact staging tree; no promotion snapshot is needed."
            close_staging_promotions
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$existing_snapshot" ]; then
            # A repository-token push may not emit a follow-up pull_request
            # event. Fetch the current snapshot head explicitly so the lease
            # protects a concurrent manual update before refreshing it.
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" --no-tags
            existing_commit=$(git rev-parse "origin/$branch")
          else
            branch="codex/promote-staging-snapshot-${GITHUB_RUN_ID}"
          fi

          git switch --create "$branch" origin/main
          git read-tree --reset -u origin/staging

          if [ -n "$existing_snapshot" ]; then
            snapshot_tree=$(git rev-parse "origin/$branch^{tree}")
            if [ "$snapshot_tree" = "$staging_tree" ]; then
              echo "Promotion snapshot PR #$existing_snapshot already contains the current staging tree."
              close_staging_promotions
              exit 0
            fi

            git commit -m "chore: refresh validated staging promotion tree"
            git push \
              --force-with-lease="refs/heads/$branch:$existing_commit" \
              origin "HEAD:refs/heads/$branch"
            echo "Refreshed promotion snapshot PR #$existing_snapshot to the current staging tree."
            gh workflow run validation.yml --ref "$branch"
            echo "Dispatched validation for the refreshed snapshot branch."
            close_staging_promotions
            exit 0
          fi

          git commit -m "chore: promote validated staging tree"
          git push --set-upstream origin "$branch"

          close_staging_promotions
          promotion_context="the conflicting staging promotion"
          if [ -n "$PROMOTION_PR" ]; then
            promotion_context="the conflicting staging promotion PR #$PROMOTION_PR"
          fi
          snapshot_pr=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: promote validated staging tree" \
            --body "This rebase-compatible snapshot was created because staging is not based on main. It contains the exact validated staging tree and replaces $promotion_context.")
          echo "Created $snapshot_pr"
          gh workflow run validation.yml --ref "$branch"
          echo "Dispatched validation for $branch because the snapshot PR was created with the repository token."
