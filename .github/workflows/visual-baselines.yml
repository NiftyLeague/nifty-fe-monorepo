name: Visual Baselines

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the baselines changed (route change, intentional redesign).
        required: true
        type: string

# Regenerates the visual-regression baselines ON THE RUNNER (#1913) — dev-machine
# captures can never match the linux runner. Run this, download the
# `visual-baselines` artifact, and copy the PNGs into apps/web/e2e/__screenshots__
# (committed in the same PR as the change that justified them).

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baselines:
    name: Baselines
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Regenerate baselines on the runner
        working-directory: apps/web
        env:
          VISUAL_BASELINES: 'true'
        run: bunx playwright test e2e/visual.e2e.ts --update-snapshots

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__/
          if-no-files-found: error
