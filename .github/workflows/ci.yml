name: Validate, test, and build

permissions:
  contents: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, coverage, audit, and build
    if: github.event_name != 'pull_request' || github.head_ref != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm type-check

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Audit critical production dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APPLE_STORE_ID: ${{ vars.NEXT_PUBLIC_APPLE_STORE_ID }}
          NEXT_PUBLIC_APPLE_STORE_LINK: ${{ vars.NEXT_PUBLIC_APPLE_STORE_LINK }}
          NEXT_PUBLIC_EPIC_LINK: ${{ vars.NEXT_PUBLIC_EPIC_LINK }}
          NEXT_PUBLIC_GOOGLE_PLAY_LINK: ${{ vars.NEXT_PUBLIC_GOOGLE_PLAY_LINK }}
          NEXT_PUBLIC_NETWORK: ${{ vars.NEXT_PUBLIC_NETWORK }}
          NEXT_PUBLIC_STEAM_LINK: ${{ vars.NEXT_PUBLIC_STEAM_LINK }}
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
