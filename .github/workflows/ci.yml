name: CI

on:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, Format, Lint & Type Check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APPLE_STORE_ID: '000000000'
      NEXT_PUBLIC_APPLE_STORE_LINK: 'https://apps.apple.com/app/id000000000'
      NEXT_PUBLIC_EPIC_LINK: 'https://store.epicgames.com/'
      NEXT_PUBLIC_GOOGLE_PLAY_LINK: 'https://play.google.com/store'
      NEXT_PUBLIC_STEAM_LINK: 'https://store.steampowered.com/'
      NEXT_PUBLIC_NETWORK: 'mainnet'
      NEXTAUTH_SECRET: 'build-validation-placeholder-secret-32chars'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type:check
      - name: Build
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
