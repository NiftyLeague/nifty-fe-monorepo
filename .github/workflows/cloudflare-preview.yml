name: Cloudflare Preview

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize, converted_to_draft]

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Cloudflare Preview / ${{ matrix.app }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            environment: Preview – web
          - app: app
            environment: Preview – app
          - app: docs
            environment: Preview – docs
          - app: api
            environment: Preview – api
          - app: smashers
            environment: Preview – smashers-web
    uses: 0xPlayerOne/code-foundry/.github/workflows/cloudflare-deploy.yml@v1.30.0
    with:
      mode: preview
      draft-protection: true
      wrangler-version: local
      working-directory: apps/${{ matrix.app }}
      turbo-filter: ${{ matrix.app }}
      install-working-directory: .
      build-script: build:cloudflare
      bun-version: 1.4.0
      environment: ${{ matrix.environment }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
