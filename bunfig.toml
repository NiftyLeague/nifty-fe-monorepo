[test]
# isolate disabled: 000-setup-dom.test.ts (runs first in the root bun test
# invocation) registers happy-dom, which propagates to sibling files in the
# same realm. Module-mock leakage between files is a known bun 1.3.x limitation
# (mock.restore() does not reset mock.module across files) — tracked separately.
preload = ["./test/preload.ts", "./test/setup.ts"]
exclude = ["dist/**", "node_modules/**", "coverage/**", "**/*.test.js", "**/*.spec.js", ".next/**", ".docusaurus/**", "build/**"]
timeout = 15000
